<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>TOP Form</title>
    </head>
    <body>
        <main>
            <img src="/img/background.jpg" alt="background" />
            <section>
                <p class="main-text">This is not a real online service! 
                You know you need something like this in your life to help
                you realize your deepest dreams. Sign up <i>now</i> to get started.</p>
            </section>
            <section>
                <form>
                    <h2>Let's do this!</h2>
                    <label for="fname">First Name</label>
                    <input name="fname" id="fname" type="text" />    
                    <label for="lname">Last Name</label>
                    <input name="lname" id="lname" type="text" />
                    <label for="email">Email</label>
                    <input name="email" id="email" type="text" />
                    <label for="phone">Phone Number</label>
                    <input name="phone" id="phone" type="text" />
                    <label for="password">Password</label>
                    <input name="password" id="password" type="text" required />
                    <label for="confirm">Confirm Password</label>
                    <input name="confirm" id="confirm" type="text" required />
                
                    <button type="submit">Create Account</button>
                    <p>Already have an account? <span>Log in</span></p>
                </form>
            </section>
        </main>
    </body>
</html>
